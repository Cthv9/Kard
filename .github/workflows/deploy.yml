name: Deploy to GitHub Pages

# La PWA è dismessa: il sito pubblica solo la pagina di congedo (site/) e le due
# pagine richieste da Google Play (privacy e cancellazione account, public/).
# Il sorgente della PWA resta nel repo ma non viene più compilato né pubblicato.
# Gli indirizzi /Kard/privacy.html e /Kard/elimina-account.html NON devono
# cambiare: sono registrati in Play Console e linkati dall'app Android.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp site/index.html site/sw.js _site/
          cp site/index.html _site/404.html
          cp public/privacy.html public/elimina-account.html public/favicon.svg public/favicon.ico _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
